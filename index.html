<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خد دا</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* لمنع ظهور شريط التمرير */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #playButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: rgba(0, 0, 0, 0.7);
            border: 2px solid white;
            border-radius: 5px;
            cursor: pointer;
            display: none; /* الزر يكون مخفي في البداية */
        }
    </style>
</head>
<body>

    <img src="https://i.pinimg.com/474x/da/cb/22/dacb2211538142df6e665c8042686043.jpg" alt="صورة مميزة">

    <audio id="myAudio" src="ss.mp3" preload="auto" loop></audio>

    <button id="playButton">اضغط علي الهدية 🎁</button>

    <script>
        const audio = document.getElementById("myAudio");
        const playButton = document.getElementById("playButton");

        // محاولة تشغيل الصوت تلقائياً
        audio.play().then(() => {
            // إذا نجح التشغيل التلقائي، أخفي الزر
            playButton.style.display = 'none';
        }).catch(() => {
            // إذا فشل التشغيل التلقائي، أظهر الزر
            playButton.style.display = 'block';
        });

        // تشغيل الصوت عند الضغط على الزر
        playButton.addEventListener('click', () => {
            audio.play();
            playButton.style.display = 'none';
        });
    </script>

</body>
</html>
